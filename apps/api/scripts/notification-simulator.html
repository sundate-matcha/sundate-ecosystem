<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Simulator - Sundate Matcha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .notification {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            position: relative;
        }

        .notification:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .notification.time-sensitive {
            border-left: 5px solid #ff3b30;
            background: #fff5f5;
        }

        .notification.high-priority {
            border-left: 5px solid #ff9500;
            background: #fff8f0;
        }

        .notification-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .notification-body {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .notification-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            color: #999;
        }

        .notification-time {
            font-style: italic;
        }

        .notification-badge {
            background: #ff3b30;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #0056CC;
            transform: translateY(-1px);
        }

        .btn.secondary {
            background: #6c757d;
        }

        .btn.secondary:hover {
            background: #545b62;
        }

        .btn.success {
            background: #28a745;
        }

        .btn.success:hover {
            background: #1e7e34;
        }

        .btn.danger {
            background: #dc3545;
        }

        .btn.danger:hover {
            background: #c82333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e9ecef;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #007AFF;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .api-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            margin-bottom: 20px;
        }

        .api-info h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .api-endpoint {
            background: #2d3748;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .content {
                padding: 20px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔔 Notification Simulator</h1>
            <p>Test your Sundate Matcha notification system</p>
        </div>
        
        <div class="content">
            <div class="api-info">
                <h3>🌐 API Configuration</h3>
                <div class="api-endpoint">Base URL: <span id="apiUrl">http://localhost:5001/api</span></div>
                <div class="api-endpoint">User ID: <span id="userId">test-user-123</span></div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalNotifications">0</div>
                    <div class="stat-label">Total Notifications</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="unreadCount">0</div>
                    <div class="stat-label">Unread</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="timeSensitiveCount">0</div>
                    <div class="stat-label">Time-Sensitive</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="highPriorityCount">0</div>
                    <div class="stat-label">High Priority</div>
                </div>
            </div>

            <div class="section">
                <h2>🎮 Controls</h2>
                <div class="controls">
                    <button class="btn" onclick="fetchNotifications()">Refresh Notifications</button>
                    <button class="btn secondary" onclick="createTestNotification()">Create Test Notification</button>
                    <button class="btn success" onclick="createTimeSensitiveNotification()">Create Time-Sensitive</button>
                    <button class="btn danger" onclick="markAllAsRead()">Mark All as Read</button>
                </div>
            </div>

            <div class="section">
                <h2>📱 Notifications</h2>
                <div id="notifications">
                    <div class="loading">Loading notifications...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5001/api';
        const USER_ID = 'test-user-123';

        // Sample notification data
        const sampleNotifications = [
            {
                title: '🎉 Welcome to Sundate Matcha!',
                body: 'Your reservation system is ready to use. Book your table now!',
                type: 'system',
                priority: 'normal',
                isTimeSensitive: false,
                isRead: false,
                timeAgo: '2m ago'
            },
            {
                title: '✅ Reservation Confirmed',
                body: 'Your reservation for 2 guests on Jan 15, 2025 at 7:00 PM has been confirmed',
                type: 'reservation_confirmed',
                priority: 'high',
                isTimeSensitive: true,
                isRead: false,
                timeAgo: '5m ago'
            },
            {
                title: '⏰ Reservation Reminder',
                body: 'Your reservation is in 1 hour. Please arrive on time.',
                type: 'reservation_reminder',
                priority: 'high',
                isTimeSensitive: true,
                isRead: true,
                timeAgo: '10m ago'
            },
            {
                title: '🍵 Special Offer',
                body: 'Get 20% off your next visit with code WELCOME20',
                type: 'promotional',
                priority: 'low',
                isTimeSensitive: false,
                isRead: false,
                timeAgo: '1h ago'
            },
            {
                title: '📝 Reservation Updated',
                body: 'Your reservation details have been updated. Please review the changes.',
                type: 'reservation_updated',
                priority: 'normal',
                isTimeSensitive: false,
                isRead: true,
                timeAgo: '2h ago'
            }
        ];

        let notifications = [...sampleNotifications];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderNotifications();
            updateStats();
        });

        // Fetch notifications from API
        async function fetchNotifications() {
            try {
                const response = await fetch(`${API_BASE_URL}/notifications?userId=${USER_ID}&prioritizeTimeSensitive=true`);
                const data = await response.json();
                
                if (data.notifications) {
                    notifications = data.notifications.map(n => ({
                        ...n,
                        timeAgo: getTimeAgo(new Date(n.createdAt))
                    }));
                }
                
                renderNotifications();
                updateStats();
            } catch (error) {
                console.error('Error fetching notifications:', error);
                showError('Failed to fetch notifications. Using sample data.');
                renderNotifications();
                updateStats();
            }
        }

        // Create test notification
        async function createTestNotification() {
            const testNotification = {
                title: '🧪 Test Notification',
                body: 'This is a test notification created from the simulator',
                type: 'system',
                priority: 'normal',
                isTimeSensitive: false,
                isRead: false,
                timeAgo: 'Just now'
            };

            notifications.unshift(testNotification);
            renderNotifications();
            updateStats();
        }

        // Create time-sensitive notification
        async function createTimeSensitiveNotification() {
            const urgentNotification = {
                title: '🚨 URGENT: Table Change',
                body: 'Your table has been changed due to maintenance. Please check your reservation.',
                type: 'system',
                priority: 'high',
                isTimeSensitive: true,
                isRead: false,
                timeAgo: 'Just now'
            };

            notifications.unshift(urgentNotification);
            renderNotifications();
            updateStats();
        }

        // Mark all as read
        async function markAllAsRead() {
            notifications.forEach(notification => {
                notification.isRead = true;
            });
            renderNotifications();
            updateStats();
        }

        // Mark notification as read
        async function markAsRead(index) {
            notifications[index].isRead = true;
            renderNotifications();
            updateStats();
        }

        // Render notifications
        function renderNotifications() {
            const container = document.getElementById('notifications');
            
            if (notifications.length === 0) {
                container.innerHTML = '<div class="loading">No notifications found</div>';
                return;
            }

            container.innerHTML = notifications.map((notification, index) => `
                <div class="notification ${notification.isTimeSensitive ? 'time-sensitive' : ''} ${notification.priority === 'high' ? 'high-priority' : ''}">
                    <div class="notification-title">
                        ${notification.title}
                        ${!notification.isRead ? '<span class="notification-badge">!</span>' : ''}
                    </div>
                    <div class="notification-body">${notification.body}</div>
                    <div class="notification-meta">
                        <span class="notification-time">${notification.timeAgo}</span>
                        <div>
                            <span>Priority: ${notification.priority}</span>
                            ${notification.isTimeSensitive ? ' | Time-sensitive' : ''}
                        </div>
                    </div>
                    ${!notification.isRead ? `<button class="btn success" onclick="markAsRead(${index})" style="margin-top: 10px; padding: 5px 10px; font-size: 0.8em;">Mark as Read</button>` : ''}
                </div>
            `).join('');
        }

        // Update statistics
        function updateStats() {
            const total = notifications.length;
            const unread = notifications.filter(n => !n.isRead).length;
            const timeSensitive = notifications.filter(n => n.isTimeSensitive).length;
            const highPriority = notifications.filter(n => n.priority === 'high').length;

            document.getElementById('totalNotifications').textContent = total;
            document.getElementById('unreadCount').textContent = unread;
            document.getElementById('timeSensitiveCount').textContent = timeSensitive;
            document.getElementById('highPriorityCount').textContent = highPriority;
        }

        // Get time ago string
        function getTimeAgo(date) {
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('notifications');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        // Auto-refresh every 30 seconds
        setInterval(fetchNotifications, 30000);
    </script>
</body>
</html>
